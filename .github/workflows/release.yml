name: Release build

on:
  pull_request:
    paths:
      - shim/**
      - nix/rapids.nix
      - raft/**
      - raft-x86_64-linux/**
      - scripts/release.sh
      - scripts/release/**
      - .github/workflows/release.yml
      - .github/actions/free-disk/**
      - flake.nix
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CHECKOUT_REF: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: The native release a tag drafts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - id: plan
        name: Draft only for v<raft-x86_64-linux's version>
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: scripts/release/draft-tag.sh "$TAG" >>"$GITHUB_OUTPUT"

  libraftrkt:
    name: libraftrkt for glibc 2.28, every RAPIDS architecture
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: ./.github/actions/free-disk
      - name: Build and gate
        run: scripts/release.sh build "$RUNNER_TEMP/libraftrkt"
      - name: Load check
        run: scripts/release.sh load-check "$RUNNER_TEMP/libraftrkt"
      - name: Manifest
        run: cat "$RUNNER_TEMP/libraftrkt/manifest.json"
      - uses: actions/upload-artifact@v7
        with:
          name: libraftrkt-x86_64-linux
          path: ${{ runner.temp }}/libraftrkt
          if-no-files-found: error

  native-package:
    name: raft-x86_64-linux, installed from a local catalog with no GPU
    needs: [plan, libraftrkt]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/download-artifact@v8
        with:
          name: libraftrkt-x86_64-linux
          path: ${{ runner.temp }}/libraftrkt
      - name: Package
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: scripts/release.sh package "$RUNNER_TEMP/libraftrkt" "$RUNNER_TEMP/dist"
      - name: Catalog test
        run: scripts/release.sh catalog-test "$RUNNER_TEMP/libraftrkt" "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@v7
        with:
          name: raft-x86_64-linux
          path: ${{ runner.temp }}/dist
          if-no-files-found: error

  draft-release:
    name: Draft the GitHub Release
    if: needs.plan.outputs.tag != ''
    needs: [plan, libraftrkt, native-package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: libraftrkt-x86_64-linux
          path: ${{ runner.temp }}/libraftrkt
      - uses: actions/download-artifact@v8
        with:
          name: raft-x86_64-linux
          path: ${{ runner.temp }}/dist
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag
          --title "$GITHUB_REF_NAME"
          --notes "raft-x86_64-linux $GITHUB_REF_NAME and its catalog entry"
          "$RUNNER_TEMP/dist/raft-x86_64-linux.zip"
          "$RUNNER_TEMP/dist/raft-x86_64-linux.zip.CHECKSUM"
          "$RUNNER_TEMP/dist/catalog-entry.rktd"
          "$RUNNER_TEMP/libraftrkt/manifest.json"
          "$RUNNER_TEMP/libraftrkt/SHA256SUMS"
